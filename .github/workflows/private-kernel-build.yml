name: Private Kernel Build

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        required: true
        type: choice
        options:
          - all
          - lkm
          - image
          - full
        default: all

permissions:
  contents: read

concurrency:
  group: private-kernel-build
  cancel-in-progress: false

jobs:
  build:
    environment: private-build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Run isolated private build
        shell: bash
        env:
          BUILD_TARGET: ${{ inputs.target }}
          PRIVATE_LOG_PASSWORD: ${{ secrets.PRIVATE_BUILD_LOG_PASSWORD }}
          PRIVATE_REF: ${{ secrets.PRIVATE_BUILD_REF }}
          PRIVATE_REPOSITORY: ${{ secrets.PRIVATE_BUILD_REPOSITORY }}
          PRIVATE_SSH_KEY: ${{ secrets.PRIVATE_BUILD_SSH_KEY }}
        run: |
          set -euo pipefail
          set +x
          umask 077

          for value in PRIVATE_LOG_PASSWORD PRIVATE_REF PRIVATE_REPOSITORY PRIVATE_SSH_KEY; do
            if [[ -z "${!value:-}" ]]; then
              printf 'Required build credential is unavailable.\n' >&2
              exit 78
            fi
          done

          source_dir="$RUNNER_TEMP/private-source"
          private_workspace="$RUNNER_TEMP/private-kernel-workspace"
          private_ccache="$RUNNER_TEMP/ccache"
          key_file="$RUNNER_TEMP/private-build-key"
          known_hosts="$RUNNER_TEMP/private-known-hosts"
          log_file="$RUNNER_TEMP/private-build.log"
          artifacts="$GITHUB_WORKSPACE/artifacts"
          diagnostics="$GITHUB_WORKSPACE/diagnostics"

          cleanup() {
            rm -f "$key_file" "$known_hosts" "$log_file"
            if [[ -d "$source_dir" ]]; then
              find "$source_dir" -depth -delete
            fi
            if [[ -d "$private_workspace" ]]; then
              find "$private_workspace" -depth -delete
            fi
            if [[ -d "$private_ccache" ]]; then
              find "$private_ccache" -depth -delete
            fi
          }
          trap cleanup EXIT

          printf '%s\n' "$PRIVATE_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          ssh-keyscan -t ed25519 github.com > "$known_hosts" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts -o LogLevel=ERROR"

          run_private_build() {
            mkdir -p "$source_dir" "$artifacts"
            git -C "$source_dir" init -q
            git -C "$source_dir" remote add origin "$PRIVATE_REPOSITORY"
            git -C "$source_dir" fetch -q --depth=1 origin "$PRIVATE_REF"
            git -C "$source_dir" checkout -q --detach FETCH_HEAD
            "$source_dir/.github/private-build/entrypoint.sh" \
              "$BUILD_TARGET" "$artifacts"
          }

          set +e
          run_private_build > "$log_file" 2>&1
          status=$?
          set -e

          if (( status != 0 )); then
            mkdir -p "$diagnostics"
            openssl enc -aes-256-cbc -pbkdf2 -salt \
              -pass env:PRIVATE_LOG_PASSWORD \
              -in "$log_file" \
              -out "$diagnostics/private-build.log.enc"
            printf 'Private build failed; encrypted diagnostics are available.\n' >&2
            exit "$status"
          fi

          case "$BUILD_TARGET" in
            all) expected_count=4 ;;
            lkm|image|full) expected_count=2 ;;
            *) exit 64 ;;
          esac

          actual_count="$(find "$artifacts" -maxdepth 1 -type f | wc -l)"
          if [[ "$actual_count" -ne "$expected_count" ]] || \
             [[ ! -s "$artifacts/SHA256SUMS.txt" ]] || \
             find "$artifacts" -mindepth 1 -maxdepth 1 ! -type f | grep -q . || \
             find "$artifacts" -maxdepth 1 -type f -size +128M | grep -q . || \
             find "$artifacts" -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' \
               ! -name 'Image-*' ! -name '*.ko' | grep -q .; then
            printf 'Artifact allowlist validation failed.\n' >&2
            exit 65
          fi
          if ! awk 'NF != 2 || $1 !~ /^[0-9a-f]{64}$/ || $2 !~ /^\*?[A-Za-z0-9._+-]+$/ { exit 1 }' \
              "$artifacts/SHA256SUMS.txt"; then
            printf 'Artifact manifest validation failed.\n' >&2
            exit 65
          fi
          (cd "$artifacts" && sha256sum --status -c SHA256SUMS.txt)
          printf 'Private build completed and release artifacts were verified.\n'

      - name: Upload verified artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: private-kernel-${{ inputs.target }}-${{ github.run_number }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload encrypted diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: encrypted-private-build-diagnostics-${{ github.run_number }}
          path: diagnostics/private-build.log.enc
          if-no-files-found: ignore
          retention-days: 1
